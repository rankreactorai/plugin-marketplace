name: regenerate-plugin-index
on:
  workflow_dispatch:
  push:
    branches: [cursor/add-rankreactor-plugin-4153]
    paths:
      - .github/workflows/regenerate-plugin-index.yml
      - .grok-plugin/marketplace.json
jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/add-rankreactor-plugin-4153
      - name: Generate plugin index
        run: python3 scripts/generate-plugin-index.py
      - name: Commit regenerated index
        run: |
          git config user.name "flagman5"
          git config user.email "8294299+flagman5@users.noreply.github.com"
          git add .grok-plugin/plugin-index.json
          if git diff --cached --quiet; then
            echo "plugin-index.json already current"
          else
            git commit -m "Regenerate plugin-index.json for RankReactor catalog entry"
            git push
          fi
