name: bump-rankreactor-sha
on:
  workflow_dispatch:
  push:
    branches: [cursor/rankreactor-marketplace-4153]
    paths:
      - .github/workflows/bump-rankreactor-sha.yml
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/rankreactor-marketplace-4153
      - name: Bump pin and regenerate index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.grok-plugin/marketplace.json')
          old = '1b1fefd9736d6dda68f5a46243b9298548d473ed'
          new = '226afe5f44e8bf220b5a871fff24e0d37aea602a'
          text = p.read_text()
          if old not in text:
              raise SystemExit('old sha not found in marketplace.json')
          p.write_text(text.replace(old, new, 1))
          PY
          python3 scripts/generate-plugin-index.py
          python3 scripts/validate-catalog.py
          python3 scripts/generate-plugin-index.py --check
      - name: Commit pin bump
        run: |
          git config user.name "flagman5"
          git config user.email "8294299+flagman5@users.noreply.github.com"
          git add .grok-plugin/marketplace.json .grok-plugin/plugin-index.json
          git commit -m "Bump RankReactor pin to 226afe5f44e8bf220b5a871fff24e0d37aea602a"
          git push
